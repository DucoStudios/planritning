<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Planritning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Architects+Daughter&display=swap">
<style>
/* Layout: ritbordsapp i helskärm. Verktyg till vänster, ritpapper i mitten, egenskaper + ytor till höger.
   Tema: samma whiteboard-utseende som CRM:et (sites/admin/whiteboard.css i Duco-repot):
   krämvit tavla, korall/blå/gul, feta sans-serif-rubriker och pill-knappar. */
:root{
  --paper:#fffefa;
  --desk:#faf7ef;
  --chrome:#fffefa;
  --line:#e7e0cd;
  --ink:#2b2a24;
  --muted:#635f52;
  --accent:#2f6fb0;
  --accent-deep:#245a91;
  --accent-soft:#dbe9f5;
  --coral:#e0603c;
  --coral-shadow:#a8492c;
  --yellow:#f4c94f;
  --yellow-soft:#fdf3cf;
  --warn:#c0392b;
  --f-ui:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --f-hand:"Architects Daughter", "Comic Sans MS", cursive;
  color-scheme: light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--desk);color:var(--ink);font-family:var(--f-ui);font-size:13px;overflow:hidden;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
#app{display:flex;flex-direction:column;height:100%}
header#top{display:flex;align-items:center;gap:10px;padding:0 14px;height:56px;background:var(--chrome);border-bottom:2px solid var(--line);flex:none;min-width:0}
.brand{font-size:19px;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.brand em{font-style:normal;color:var(--coral)}
#pname{border:2px solid transparent;background:transparent;padding:4px 10px;border-radius:999px;width:190px;font-weight:700}
#pname:hover,#pname:focus{border-color:var(--line);background:var(--paper);outline:none}
#floors{display:flex;gap:2px;align-items:center;overflow-x:auto;min-width:0;flex:1}
.ftab{border:2px solid var(--line);background:var(--paper);padding:5px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;font-weight:700}
.ftab:hover{border-color:var(--ink)}
.ftab.on{background:var(--ink);border-color:var(--ink);color:var(--desk)}
.ftab.on small{color:#cfc8b6}
.ftab small{color:var(--muted);font-weight:400;margin-left:6px;font-variant-numeric:tabular-nums}
.btn{border:2px solid var(--line);background:transparent;padding:5px 13px;border-radius:999px;cursor:pointer;white-space:nowrap;font-weight:700;transition:transform .06s,box-shadow .06s}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--coral);border-color:var(--coral);color:#fffaf5;box-shadow:0 3px 0 var(--coral-shadow)}
.btn.pri:hover{background:#e86d4a;border-color:#e86d4a}
.btn.pri:active{transform:translateY(2px);box-shadow:0 1px 0 var(--coral-shadow)}
.btn.danger{color:var(--warn)}
.btn.armed{background:var(--warn);border-color:var(--warn);color:#fff}
.btn.on{background:var(--ink);border-color:var(--ink);color:var(--desk)}
.btn:disabled{opacity:.4;cursor:default;border-color:var(--line)}
.btn:focus-visible,.tool:focus-visible,.ftab:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seg{display:flex;border:2px solid var(--line);border-radius:999px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:transparent;padding:5px 14px;cursor:pointer;font-weight:700}
.seg button.on{background:var(--ink);color:var(--desk)}
#main{display:flex;flex:1;min-height:0}
nav#tools{width:62px;flex:none;background:var(--chrome);border-right:2px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:3px;overflow-y:auto}
.tool{width:48px;height:48px;border:2px solid transparent;border-radius:14px;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:9.5px;color:var(--muted);position:relative}
.tool svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:1.6}
.tool:hover{background:var(--paper);border-color:var(--line)}
.tool.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.tool.on svg{stroke:var(--accent)}
.tool kbd{position:absolute;top:2px;right:5px;font-size:8.5px;font-family:var(--f-ui);color:#a39d8c}
.tool.on{font-weight:700}
.tsep{width:32px;height:1px;background:var(--line);margin:4px 0}
#stage{flex:1;position:relative;min-width:0;display:flex;flex-direction:column}
#optbar{height:44px;flex:none;display:flex;align-items:center;gap:12px;padding:0 14px;background:var(--chrome);border-bottom:2px solid var(--line);white-space:nowrap;overflow-x:auto}
#optbar label{display:flex;align-items:center;gap:6px;color:var(--muted)}
#optbar input[type=number]{width:72px}
#optbar .hint{color:var(--muted);margin-left:auto;font-size:12px}
input[type=number],input[type=text],select{border:1px solid var(--line);border-radius:10px;padding:5px 8px;background:var(--paper);font-variant-numeric:tabular-nums}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
#canvaswrap{flex:1;position:relative;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#cv.pan{cursor:grab}
#cv.sel{cursor:default}
#status{position:absolute;left:12px;bottom:10px;display:flex;gap:12px;align-items:center;font-size:11.5px;color:var(--muted);background:rgba(255,254,250,.94);border:2px solid var(--line);border-radius:999px;padding:3px 12px;font-variant-numeric:tabular-nums;pointer-events:auto}
#status button{border:0;background:none;color:var(--accent-deep);font-weight:700;cursor:pointer;padding:0;font-size:11.5px}
#lenbox{position:absolute;display:flex;align-items:center;gap:6px;background:var(--ink);color:#fff;padding:5px 10px;border-radius:999px;font-size:12px;z-index:5;box-shadow:0 4px 14px rgba(0,0,0,.2)}
#lenbox input{width:110px;background:#fff;color:var(--ink);border:0}
#lenbox small{color:#b9c0c6}
aside#panel{width:310px;flex:none;background:var(--chrome);border-left:2px solid var(--line);overflow-y:auto;display:flex;flex-direction:column}
.psec{padding:14px 14px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.psec h3{margin:0;font-size:14px;letter-spacing:-.01em;color:var(--ink);font-weight:800}
.psec h2{margin:0;font-size:16px;font-weight:800}
.psec h4{margin:4px 0 0;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.row{display:grid;grid-template-columns:110px 1fr;align-items:center;gap:8px}
.row label{color:var(--muted)}
.row input,.row select{width:100%;min-width:0}
.unit{position:relative}
.unit input{padding-right:34px}
.unit span{position:absolute;right:8px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:11px;pointer-events:none}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.big{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.note{color:var(--muted);font-size:12px;line-height:1.45;margin:0}
table.areas{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.areas td{padding:4px 0;border-bottom:1px dotted var(--line)}
table.areas td:last-child{text-align:right;white-space:nowrap}
table.areas tr.click{cursor:pointer}
table.areas tr.click:hover td{background:var(--yellow-soft)}
table.areas tr.tot td{font-weight:800;border-bottom:0;padding-top:8px}
table.areas tr.sub td{color:var(--muted);border-bottom:0}
.lib{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.lib button{border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:4px 2px 5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px}
.lib button.on{border-color:var(--accent);background:var(--accent-soft)}
.lib canvas{width:64px;height:48px}
.libcat{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-top:4px;font-weight:700}
.swatches{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.sw{aspect-ratio:1;border-radius:50%;border:2px solid rgba(43,42,36,.14);cursor:pointer;padding:0;position:relative}
.sw:hover{transform:scale(1.12)}
.sw.on{outline:2px solid var(--ink);outline-offset:2px}
.sw.none{background:linear-gradient(135deg,var(--paper) 45%,var(--warn) 45%,var(--warn) 55%,var(--paper) 55%)}
.colorrow{display:flex;align-items:center;gap:8px}
.colorrow input[type=color]{width:38px;height:28px;border:2px solid var(--line);border-radius:999px;padding:0 2px;background:var(--paper);cursor:pointer}
.palette{display:flex;flex-wrap:wrap;gap:6px}
.palette .chip{display:flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:999px;padding:2px 9px 2px 3px;background:var(--paper);font-size:11.5px;cursor:pointer}
.palette .chip i{width:18px;height:18px;border-radius:50%;border:1px solid rgba(43,42,36,.18);display:block}
.palette .chip:hover{border-color:var(--ink)}
.order{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.order .btn{padding:5px 4px;font-size:12px}
.order.two{grid-template-columns:1fr 1fr}
.layers{display:flex;flex-direction:column;gap:5px}
.layer{display:grid;grid-template-columns:22px 1fr auto 28px 28px 24px;align-items:center;gap:4px;border:2px solid var(--line);border-radius:12px;padding:3px 4px 3px 6px;background:var(--paper)}
.layer.on{border-color:var(--accent);background:var(--accent-soft)}
.layer.off .lname{opacity:.45;text-decoration:line-through}
.layer input.lname{border:0;background:transparent;padding:3px 4px;border-radius:6px;font-weight:700;min-width:0;width:100%}
.layer input.lname:focus{background:var(--paper);box-shadow:0 0 0 2px var(--accent-soft)}
.layer .cnt{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;padding:0 2px}
.layer button{border:0;background:transparent;cursor:pointer;padding:3px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.layer button:hover{background:rgba(43,42,36,.07)}
.layer button svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.layer button.dim{color:#b3ad9c}
.layer .dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted);padding:0}
.layer.on .dot{border-color:var(--accent);background:radial-gradient(circle,var(--accent) 45%,transparent 50%)}
.grouptag{display:inline-block;background:var(--yellow);color:#3a2e05;border-radius:2px;transform:rotate(-2deg);padding:1px 7px;font-size:11px;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
#view3d{position:absolute;inset:0;background:#efe9dc;display:flex;flex-direction:column;z-index:4}
#view3d[hidden]{display:none!important}
#bar3d{height:44px;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--chrome);border-bottom:2px solid var(--line);white-space:nowrap;overflow-x:auto;flex:none}
#gl{flex:1;position:relative;min-height:0}
#gl canvas{display:block;width:100%;height:100%}
#modal{position:fixed;inset:0;background:rgba(20,22,24,.55);display:flex;align-items:center;justify-content:center;z-index:20;padding:24px}
#modal[hidden]{display:none!important}
.mbox{background:var(--paper);border-radius:16px;box-shadow:0 20px 50px rgba(30,25,10,.25);max-width:1100px;width:100%;max-height:100%;overflow:auto;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.mhead{display:flex;align-items:center;gap:10px}
.mhead h2{margin:0;font-size:18px;font-weight:800;flex:1}
.prow{display:flex;align-items:center;gap:8px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:#fff}
.prow.cur{border-color:var(--accent);background:var(--accent-soft)}
.pinfo{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.pinfo b{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pinfo span{font-size:12px;color:var(--muted)}
#plib{display:flex;flex-direction:column;gap:8px}
.pfoot{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pnote,.pempty{margin:0;font-size:13px;color:var(--muted)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.gallery figure{margin:0;display:flex;flex-direction:column;gap:6px}
.gallery img{width:100%;border:2px solid var(--line);border-radius:12px;background:#fff}
.gallery figcaption{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:999px;font-weight:600;font-size:12.5px;z-index:30}
#toast[hidden]{display:none!important}
@media (max-width:820px){aside#panel{position:absolute;right:0;top:56px;bottom:0;z-index:6;width:260px;box-shadow:-6px 0 18px rgba(0,0,0,.12)} aside#panel.closed{display:none} .brand{display:none} #pname{width:110px}}
@media (min-width:821px){#panelBtn{display:none}}
</style>

<script>
"use strict";
/* ============================================================
   Planritning. Alla mått lagras i millimeter.
   ============================================================ */
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 10);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const INK = '#2b2a24', ACC = '#2f6fb0', DIMC = '#5f5a4e';
const HAND = '"Architects Daughter", "Comic Sans MS", cursive';
const STORE = 'planritning.v1';

/* ---------- vektorer ---------- */
const sub = (a, b) => ({ x: a.x - b.x, y: a.y - b.y });
const add = (a, b) => ({ x: a.x + b.x, y: a.y + b.y });
const mul = (a, k) => ({ x: a.x * k, y: a.y * k });
const dot = (a, b) => a.x * b.x + a.y * b.y;
const cross = (a, b) => a.x * b.y - a.y * b.x;
const vlen = a => Math.hypot(a.x, a.y);
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const norm = a => { const l = Math.hypot(a.x, a.y) || 1; return { x: a.x / l, y: a.y / l }; };
const lerp = (a, b, t) => ({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t });
const segT = (p, a, b) => { const ab = sub(b, a); const l2 = dot(ab, ab) || 1; return dot(sub(p, a), ab) / l2; };
const distSeg = (p, a, b) => dist(p, lerp(a, b, clamp(segT(p, a, b), 0, 1)));
const wA = w => ({ x: w.x1, y: w.y1 });
const wB = w => ({ x: w.x2, y: w.y2 });
function wInfo(w) {
  const a = wA(w), b = wB(w), d = sub(b, a), L = vlen(d);
  const u = L ? mul(d, 1 / L) : { x: 1, y: 0 };
  return { a, b, L, u, n: { x: -u.y, y: u.x } };
}
function signedArea(poly) {
  let s = 0;
  for (let i = 0; i < poly.length; i++) { const p = poly[i], q = poly[(i + 1) % poly.length]; s += p.x * q.y - q.x * p.y; }
  return s / 2;
}
function inPoly(p, poly) {
  let c = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const a = poly[i], b = poly[j];
    if ((a.y > p.y) !== (b.y > p.y) && p.x < (b.x - a.x) * (p.y - a.y) / (b.y - a.y) + a.x) c = !c;
  }
  return c;
}
function centroid(poly) {
  let A = 0, cx = 0, cy = 0;
  for (let i = 0; i < poly.length; i++) {
    const p = poly[i], q = poly[(i + 1) % poly.length], k = p.x * q.y - q.x * p.y;
    A += k; cx += (p.x + q.x) * k; cy += (p.y + q.y) * k;
  }
  if (Math.abs(A) < 1e-6) return poly[0];
  return { x: cx / (3 * A), y: cy / (3 * A) };
}
// Förskjut polygon: dir=+1 in mot den inneslutna ytan, -1 utåt. ts = väggtjocklek per kant.
function offsetPoly(poly, ts, dir) {
  const s = signedArea(poly) > 0 ? 1 : -1, n = poly.length, lines = [];
  for (let i = 0; i < n; i++) {
    const p = poly[i], q = poly[(i + 1) % n], u = norm(sub(q, p));
    const nin = { x: -u.y * s, y: u.x * s }, d = ts[i] / 2 * dir;
    lines.push({ p: add(p, mul(nin, d)), u, nin, d });
  }
  const out = [];
  for (let i = 0; i < n; i++) {
    const L1 = lines[(i - 1 + n) % n], L2 = lines[i], den = cross(L1.u, L2.u);
    if (Math.abs(den) < 1e-6) { out.push(add(poly[i], mul(L2.nin, L2.d))); continue; }
    const t = cross(sub(L2.p, L1.p), L2.u) / den;
    out.push(add(L1.p, mul(L1.u, t)));
  }
  return out;
}
const fmtMM = v => Math.round(v).toLocaleString('sv-SE');
const fmtM2 = v => v.toLocaleString('sv-SE', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' m²';
const fmtM = v => (v / 1000).toLocaleString('sv-SE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
function parseNum(s) { const v = parseFloat(String(s).replace(/\s/g, '').replace(',', '.')); return isFinite(v) ? v : NaN; }
// Inmatad längd: under 100 tolkas som meter (4,2 blir 4200 mm)
function parseLen(s) { const v = parseNum(s); if (!isFinite(v)) return NaN; return Math.abs(v) < 100 ? v * 1000 : v; }

/* ---------- möbelbibliotek ---------- */
const LIB = {
  bed2: { name: 'Dubbelsäng', w: 1600, d: 2000, h: 500, cat: 'Sovrum', col: 0xe9e4da },
  bed1: { name: 'Enkelsäng', w: 900, d: 2000, h: 500, cat: 'Sovrum', col: 0xe9e4da },
  wardrobe: { name: 'Garderob', w: 1200, d: 600, h: 2100, cat: 'Sovrum', col: 0xf2efe8 },
  sofa: { name: 'Soffa', w: 2200, d: 900, h: 800, cat: 'Vardagsrum', col: 0x8a96a3 },
  armchair: { name: 'Fåtölj', w: 800, d: 800, h: 800, cat: 'Vardagsrum', col: 0x8a96a3 },
  coffee: { name: 'Soffbord', w: 1100, d: 600, h: 450, cat: 'Vardagsrum', col: 0x9b7653 },
